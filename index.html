<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para meu amor ❤️</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<h1>Para você ❤️</h1>

<p>
Meu amor, preparei algo especial pra você.<br><br>
Mas pra descobrir, vai ter que montar nosso quebra-cabeça ❤️<br>
Cada pedacinho guarda um pedacinho do que sinto por você.
</p>

<h2>⬇️ Monte nosso quebra-cabeça ⬇️</h2>

<div id="puzzle"></div>

<audio autoplay loop controls>
    <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const puzzle = document.getElementById("puzzle");

for(let i=0;i<9;i++){
    let div = document.createElement("div");
    div.className = "piece";
    div.style.backgroundPosition =
    `${-(i%3)*120}px ${-Math.floor(i/3)*120}px`;
    puzzle.appendChild(div);
}
</script>

</body>
</html>
