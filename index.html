<!DOCTYPE html>
<html lang="pt-br">
<head>

  <title>Para você ❤️</title>

<body>

      <source src="musica.mp3" type="audio/mpeg">
    </audio>

  <!-- 💖 MENSAGEM -->
  <h2 id="tituloMensagem" style="display: none;">💖 Uma coisa pra você 💖</h2>

  <script src="script.js"></script>
